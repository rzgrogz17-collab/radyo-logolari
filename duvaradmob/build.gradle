plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.wello.wallpaperose'
    compileSdk 36

    defaultConfig {
        applicationId 'com.wallpapergrafi.picapp'
        minSdk 25
        targetSdk 36
        versionCode 272
        versionName '2.7.2'
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
    }

    buildFeatures {
        buildConfig = true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'MobileAdsSdkOutdatedVersion'
    }
    buildToolsVersion '36.0.0'
}

dependencies {
    implementation files('libs/blogger-sdk-1.1.aar')
    implementation 'com.google.guava:guava:32.1.3-android'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.android.billingclient:billing:7.1.1'

    implementation platform('com.google.firebase:firebase-bom:32.0.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-config'

    implementation 'com.onesignal:OneSignal:[4.0.0, 4.99.99]'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation"com.google.android.ump:user-messaging-platform:4.0.0"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'joda-time:joda-time:2.13.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
}

tasks.register("injectClockWallpaperService") {
    doLast {
        def manifest = file("src/main/AndroidManifest.xml")
        if (!manifest.exists()) return
        def text = manifest.getText("UTF-8")
        if (!text.contains("</application>") || !text.contains("<application")) {
            throw new GradleException("AndroidManifest.xml içinde application etiketi bulunamadı")
        }
        def original = text
        if (!text.contains("xmlns:tools")) {
            text = text.replace("<manifest", "<manifest xmlns:tools=\"http://schemas.android.com/tools\"")
        }
        if (!text.contains('android.permission.SYSTEM_ALERT_WINDOW')) {
            text = text.replaceFirst("<application",
                    '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <application')
        }
        if (!text.contains('android.permission.FOREGROUND_SERVICE"')) {
            text = text.replaceFirst("<application",
                    '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <application')
        }
        if (!text.contains('android.permission.FOREGROUND_SERVICE_SPECIAL_USE')) {
            text = text.replaceFirst("<application",
                    '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n    <application')
        }
        if (!text.contains('android.permission.RECEIVE_BOOT_COMPLETED')) {
            text = text.replaceFirst("<application",
                    '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <application')
        }
        if (!text.contains("ClockLiveWallpaper")) {
            def live = """
        <service
            android:name="com.wello.wallpaperose.clock.ClockLiveWallpaper"
            android:exported="true"
            android:label="@string/clock_live_desc"
            android:permission="android.permission.BIND_WALLPAPER">
            <intent-filter>
                <action android:name="android.service.wallpaper.WallpaperService" />
            </intent-filter>
            <meta-data
                android:name="android.service.wallpaper"
                android:resource="@xml/clock_wallpaper" />
        </service>
"""
            text = text.replace("</application>", live + "    </application>")
        }
        if (!text.contains("ClockOverlayService")) {
            def overlay = """
        <service
            android:name="com.wello.wallpaperose.clock.ClockOverlayService"
            android:exported="false"
            android:foregroundServiceType="specialUse"
            android:stopWithTask="false">
            <property
                android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                android:value="Live clock drawn over the wallpaper" />
        </service>
"""
            text = text.replace("</application>", overlay + "    </application>")
        }
        if (!text.contains("ClockOverlayBoot")) {
            def boot = """
        <receiver
            android:name="com.wello.wallpaperose.clock.ClockOverlayBoot"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.BOOT_COMPLETED" />
                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
            </intent-filter>
        </receiver>
"""
            text = text.replace("</application>", boot + "    </application>")
        }
        if (text != original) manifest.write(text, "UTF-8")
    }
}

afterEvaluate {
    def preBuild = tasks.findByName("preBuild")
    if (preBuild != null) preBuild.dependsOn("injectClockWallpaperService")
}